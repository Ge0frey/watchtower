[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["../node_modules", "lib"]
allow_paths = ["../node_modules"]
# Mirrors the settings the official attestcoin-protocol-examples require. via_ir is NOT optional:
# contracts built on the ASC verification pattern hit "stack too deep" without it.
remappings = [
    "@openzeppelin/=../node_modules/@openzeppelin/",
    "@gluwa/asc-contracts/=../node_modules/@gluwa/asc-contracts/",
    "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
# london, not shanghai. Creditcoin's RPC omits `mixHash` from block headers, so Foundry cannot fork
# the chain under a post-merge EVM spec ("header validation error: `prevrandao` not set") - london is
# pre-merge and sidesteps it. It also avoids emitting PUSH0, so the bytecode runs on any EVM >= london.
# Tests and deployments therefore share identical bytecode.
evm_version = "london"
verbosity = 2
fs_permissions = [{ access = "read-write", path = "./test/fixtures" }, { access = "read", path = "../fixtures" }]

[lint]
lint_on_build = false

# Named endpoints, so `--rpc-url sepolia` works without the shell having sourced .env.
# Foundry interpolates ${...} from the .env it loads out of the current directory - which is why
# contracts/.env is a symlink to the repo-root .env.
[rpc_endpoints]
creditcoin = "${CC3_RPC}"
sepolia = "${SEPOLIA_RPC}"
mainnet = "${MAINNET_RPC}"
