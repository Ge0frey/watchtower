<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 32" width="162" height="32" fill="none" role="img" aria-label="Watchtower">
  <title>Watchtower</title>
  <!--
    THE LOCKUP · mark, one clear space, wordmark.
    ────────────────────────────────────────────────────────────────────
    The gap is the ring's radius, and it is the minimum. The sage axis runs out
    of the ring and points into the name, so this is not decoration set beside a
    word: the mark is aimed at it, and closing the gap puts the beam through
    the W.

    The name keeps the setting the interface already gives every field heading,
    JetBrains Mono Bold at 0.24em, because it is filed, not signed. Outside the
    app the face falls back through the stack below; where the webfont is not
    loaded, prefer the mark alone and set the name in the real face beside it.
  -->
  <g transform="translate(0 1) scale(0.9375)" stroke-width="2.6" stroke-linecap="round">
    <g stroke="#f2f1ec">
      <circle cx="13.2" cy="16" r="9.2" />
      <path d="M13.2 4V8.4" />
      <path d="M13.2 23.6V28" />
    </g>
    <path stroke="#7d8f6a" d="M3.9 16H28" />
  </g>
  <text x="40.6" y="21.1" fill="#f2f1ec"
        font-family="'JetBrains Mono','JetBrains Mono NL',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="14.5" font-weight="700" letter-spacing="3.48">WATCHTOWER</text>
</svg>
