<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="Watchtower">
  <title>Watchtower</title>
  <!--
    THE TAB ICON
    ────────────────────────────────────────────────────────────────────
    It carries its own paper ground on purpose. A tab strip can be any colour and
    the register is a hairline instrument, so on a dark strip with no ground it
    would simply disappear. The paper square is the one the application is printed
    on, which makes the tab read as a corner of the document rather than a sticker.
  -->
  <rect width="32" height="32" rx="7" fill="#f2f1ec" />
  <g transform="translate(16 16) scale(0.78) translate(-16 -16)" stroke-width="2.9" stroke-linecap="round">
    <g stroke="#101010">
      <circle cx="13.2" cy="16" r="9.2" />
      <path d="M13.2 4V8.4" />
      <path d="M13.2 23.6V28" />
    </g>
    <path stroke="#7d8f6a" d="M3.9 16H28" />
  </g>
</svg>
